#!/usr/bin/env bash
# OMNI — Unified configuration for D3fault-death + HuntOps integration
# All values overridable via environment variables.
# Precedence: env > omni.conf > huntops/config.sh > huntops/wordlists.conf > hardcoded

# ---- Tool paths (Kali quirks handled in lib/common.sh:find_tool) ----
# httpx: prefer httpx-toolkit (Kali), then ~/go/bin/httpx, then httpx
# gau: real binary at ~/go/bin/gau (git alias shadows it)
# amass: Debian wrapper sudo-prompts for libpostal; gated by _amass_ready()
# testssl.sh: fixed path /home/mazin/tools/testssl_tool/testssl.sh

# ---- Rate / Concurrency / Ethics (HuntOps defaults, no-DoS) ----
export OMNI_RATE_GLOBAL="${OMNI_RATE_GLOBAL:-10}"           # req/s global ceiling
export OMNI_CONCURRENCY="${OMNI_CONCURRENCY:-3}"            # parallel tool-chains
export OMNI_HOST_BUDGET="${OMNI_HOST_BUDGET:-25}"           # max concurrent hosts per tool
export OMNI_NUCLEI_RATE="${OMNI_NUCLEI_RATE:-15}"
export OMNI_NUCLEI_RATE_NO_DOS="${OMNI_NUCLEI_RATE_NO_DOS:-100}"
export OMNI_NUCLEI_CONCURRENCY="${OMNI_NUCLEI_CONCURRENCY:-10}"
export OMNI_FUF_RATE="${OMNI_FUF_RATE:-50}"
export OMNI_FUF_RATE_NO_DOS="${OMNI_FUF_RATE_NO_DOS:-150}"
export OMNI_NAABU_RATE="${OMNI_NAABU_RATE:-1000}"
export OMNI_NAABU_RATE_NO_DOS="${OMNI_NAABU_RATE_NO_DOS:-5000}"
export OMNI_MASS_RATE="${OMNI_MASS_RATE:-1000}"
export OMNI_SHUFFLED_THREADS="${OMNI_SHUFFLED_THREADS:-100}"
export OMNI_DNSX_BRUTE_SAMPLE="${OMNI_DNSX_BRUTE_SAMPLE:-100000}"
export OMNI_XARGS_PARALLEL="${OMNI_XARGS_PARALLEL:-4}"

# ---- Caps ----
export OMNI_SQLMAP_CAP="${OMNI_SQLMAP_CAP:-5}"
export OMNI_PERM_CAP="${OMNI_PERM_CAP:-300000}"
export OMNI_GAU_CAP="${OMNI_GAU_CAP:-5000}"
export OMNI_WAYBACK_TIMEOUT="${OMNI_WAYBACK_TIMEOUT:-120}"
export OMNI_NUCLEI_TIMEOUT="${OMNI_NUCLEI_TIMEOUT:-3600}"
export OMNI_NUCLEI_TIMEOUT_NO_DOS="${OMNI_NUCLEI_TIMEOUT_NO_DOS:-5400}"
export OMNI_LOW_YIELD_THRESHOLD="${OMNI_LOW_YIELD_THRESHOLD:-5}"
export OMNI_MIN_MEM_FREE_MB="${OMNI_MIN_MEM_FREE_MB:-500}"

# ---- D3fault-death specific caps ----
export OMNI_MAX_RESOLVE="${OMNI_MAX_RESOLVE:-15000}"
export OMNI_RESOLVE_PARALLEL="${OMNI_RESOLVE_PARALLEL:-50}"
export OMNI_RANK_CAP="${OMNI_RANK_CAP:-25}"
export OMNI_SHOT_TIMEOUT="${OMNI_SHOT_TIMEOUT:-300}"
export OMNI_MAX_PORTS_LIST="${OMNI_MAX_PORTS_LIST:-15}"
export OMNI_PARAM_TEST_CAP="${OMNI_PARAM_TEST_CAP:-20}"
export OMNI_HOST_CONCURRENCY="${OMNI_HOST_CONCURRENCY:-10}"

# ---- TLS (testssl.sh) ----
export OMNI_TESTSSL_BIN="${OMNI_TESTSSL_BIN:-/home/mazin/tools/testssl_tool/testssl.sh}"
export OMNI_TLS_HOST_CAP="${OMNI_TLS_HOST_CAP:-10}"
export OMNI_TLS_SCAN_OPTS="${OMNI_TLS_SCAN_OPTS:--p -s -U -P -S --fast}"

# ---- External API keys (optional, additive) ----
export OMNI_VT_API_KEY="${OMNI_VT_API_KEY:-${VT_API_KEY:-}}"
export OMNI_ST_API_KEY="${OMNI_ST_API_KEY:-${ST_API_KEY:-}}"
export OMNI_USE_INTERNETDB="${OMNI_USE_INTERNETDB:-1}"
export OMNI_USE_COMMONCRAWL="${OMNI_USE_COMMONCRAWL:-1}"

# ---- Wordlists (fallback chains; resolve_wordlist() picks first existing) ----
# DNS / Subdomain
export OMNI_WLD_DNS_PRIMARY="/usr/share/seclists/Discovery/DNS/dns-Jhaddix.txt"
export OMNI_WLD_DNS_FALLBACK1="/usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt"
export OMNI_WLD_DNS_FALLBACK2="/usr/share/wordlists/dirb/common.txt"

# Web content
export OMNI_WLD_WEB_PRIMARY="/usr/share/seclists/Discovery/Web-Content/DirBuster-2007_directory-list-2.3-small.txt"
export OMNI_WLD_WEB_FALLBACK1="/usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt"
export OMNI_WLD_WEB_FALLBACK2="/usr/share/wordlists/dirb/common.txt"

# Resolvers (for massdns/dnsx)
export OMNI_RESOLVERS_FAST="${OMNI_RESOLVERS_FAST:-config/resolvers-fast.txt}"
export OMNI_RESOLVERS_FULL="${OMNI_RESOLVERS_FULL:-config/resolvers.txt}"

# ---- Output root ----
export OMNI_OUTROOT="${OMNI_OUTROOT:-output}"

# ---- Backward-compat aliases (so existing code using old var names works) ----
# HuntOps vars
export RATE_GLOBAL="${RATE_GLOBAL:-$OMNI_RATE_GLOBAL}"
export CONCURRENCY="${CONCURRENCY:-$OMNI_CONCURRENCY}"
export HOST_BUDGET="${HOST_BUDGET:-$OMNI_HOST_BUDGET}"
export NUCLEI_RATE="${NUCLEI_RATE:-$OMNI_NUCLEI_RATE}"
export NUCLEI_RATE_NO_DOS="${NUCLEI_RATE_NO_DOS:-$OMNI_NUCLEI_RATE_NO_DOS}"
export NUCLEI_CONCURRENCY="${NUCLEI_CONCURRENCY:-$OMNI_NUCLEI_CONCURRENCY}"
export FUF_RATE="${FUF_RATE:-$OMNI_FUF_RATE}"
export FUF_RATE_NO_DOS="${FUF_RATE_NO_DOS:-$OMNI_FUF_RATE_NO_DOS}"
export NAABU_RATE="${NAABU_RATE:-$OMNI_NAABU_RATE}"
export NAABU_RATE_NO_DOS="${NAABU_RATE_NO_DOS:-$OMNI_NAABU_RATE_NO_DOS}"
export MASS_RATE="${MASS_RATE:-$OMNI_MASS_RATE}"
export SHUFFLED_THREADS="${SHUFFLED_THREADS:-$OMNI_SHUFFLED_THREADS}"
export DNSX_BRUTE_SAMPLE="${DNSX_BRUTE_SAMPLE:-$OMNI_DNSX_BRUTE_SAMPLE}"
export XARGS_PARALLEL="${XARGS_PARALLEL:-$OMNI_XARGS_PARALLEL}"
export SQLMAP_CAP="${SQLMAP_CAP:-$OMNI_SQLMAP_CAP}"
export PERM_CAP="${PERM_CAP:-$OMNI_PERM_CAP}"
export GAU_CAP="${GAU_CAP:-$OMNI_GAU_CAP}"
export WAYBACK_TIMEOUT="${WAYBACK_TIMEOUT:-$OMNI_WAYBACK_TIMEOUT}"
export NUCLEI_TIMEOUT="${NUCLEI_TIMEOUT:-$OMNI_NUCLEI_TIMEOUT}"
export NUCLEI_TIMEOUT_NO_DOS="${NUCLEI_TIMEOUT_NO_DOS:-$OMNI_NUCLEI_TIMEOUT_NO_DOS}"
export LOW_YIELD_THRESHOLD="${LOW_YIELD_THRESHOLD:-$OMNI_LOW_YIELD_THRESHOLD}"
export MIN_MEM_FREE_MB="${MIN_MEM_FREE_MB:-$OMNI_MIN_MEM_FREE_MB}"
export TESTSSL_BIN="${TESTSSL_BIN:-$OMNI_TESTSSL_BIN}"
export TLS_HOST_CAP="${TLS_HOST_CAP:-$OMNI_TLS_HOST_CAP}"
export TLS_SCAN_OPTS="${TLS_SCAN_OPTS:-$OMNI_TLS_SCAN_OPTS}"
export VT_API_KEY="${VT_API_KEY:-$OMNI_VT_API_KEY}"
export ST_API_KEY="${ST_API_KEY:-$OMNI_ST_API_KEY}"
export USE_INTERNETDB="${USE_INTERNETDB:-$OMNI_USE_INTERNETDB}"
export USE_COMMONCRAWL="${USE_COMMONCRAWL:-$OMNI_USE_COMMONCRAWL}"
export WLD_DNS="${WLD_DNS:-$OMNI_WLD_DNS_PRIMARY}"
export WLD_DNS_TOP="${WLD_DNS_TOP:-$OMNI_WLD_DNS_FALLBACK1}"
export WLD_WEB="${WLD_WEB:-$OMNI_WLD_WEB_PRIMARY}"
export WLD_WEB_MEDIUM="${WLD_WEB_MEDIUM:-$OMNI_WLD_WEB_FALLBACK1}"
export RESOLVERS="${RESOLVERS:-$OMNI_RESOLVERS_FAST}"
export OUTROOT="${OUTROOT:-$OMNI_OUTROOT}"

# D3fault-death vars
export MAX_RESOLVE="${MAX_RESOLVE:-$OMNI_MAX_RESOLVE}"
export RESOLVE_PARALLEL="${RESOLVE_PARALLEL:-$OMNI_RESOLVE_PARALLEL}"
export RANK_CAP="${RANK_CAP:-$OMNI_RANK_CAP}"
export SHOT_TIMEOUT="${SHOT_TIMEOUT:-$OMNI_SHOT_TIMEOUT}"
export MAX_PORTS_LIST="${MAX_PORTS_LIST:-$OMNI_MAX_PORTS_LIST}"
export PARAM_TEST_CAP="${PARAM_TEST_CAP:-$OMNI_PARAM_TEST_CAP}"
export HOST_CONCURRENCY="${HOST_CONCURRENCY:-$OMNI_HOST_CONCURRENCY}"
export HARVESTER_SOURCES="${HARVESTER_SOURCES:-crtsh,dnsdumpster,duckduckgo,hackertarget,otx,rapiddns,urlscan,bing,google}"
export TAKEOVER_PROVIDERS="${TAKEOVER_PROVIDERS:-github.io|herokuapp.com|herokudns.com|s3.amazonaws.com|cloudfront.net|azurewebsites.net|azureedge.net|blob.core.windows.net|cname.vercel-dns.com|netlify.app|shopify.com|zendesk.com|wordpress.com|fastly.net|pantheon.io|surge.sh|bitbucket.io|wpengine.com|tumblr.com|acquia-sites.com|usergarden.com|readme.io|ghproxy.com|ngrok.io}"