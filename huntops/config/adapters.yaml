# HuntOps — Adapter Registry
# Central registry of all scanner adapters (bash + Go)
# Used by orchestrator.sh to build the adapter registry and pipeline

adapters:
  # =========================================================================
  # RECONNAISSANCE ADAPTERS (bash)
  # =========================================================================
  subfinder:
    type: bash
    path: "lib/adapter_subfinder.sh"
    capabilities: [recon, subdomains]
    enabled: true
    priority: 10
    requires_api_key: false

  amass:
    type: bash
    path: "lib/adapter_amass.sh"
    capabilities: [recon, subdomains]
    enabled: true
    priority: 20
    requires_api_key: false

  assetfinder:
    type: bash
    path: "lib/adapter_assetfinder.sh"
    capabilities: [recon, subdomains]
    enabled: true
    priority: 30
    requires_api_key: false

  crtsh:
    type: bash
    path: "lib/adapter_crtsh.sh"
    capabilities: [recon, subdomains]
    enabled: true
    priority: 40
    requires_api_key: false

  certspotter:
    type: bash
    path: "lib/adapter_certspotter.sh"
    capabilities: [recon, subdomains]
    enabled: true
    priority: 50
    requires_api_key: false
    api_key_env: "CERTSPOTTER_API_KEY"

  dnsx:
    type: bash
    path: "lib/adapter_dnsx.sh"
    capabilities: [recon, dns, validation]
    enabled: true
    priority: 60
    requires_api_key: false

  httpx:
    type: bash
    path: "lib/adapter_httpx.sh"
