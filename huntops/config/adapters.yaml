    priority: 80
    requires_api_key: false

  nmap:
    type: bash
    path: "lib/adapter_nmap.sh"
    capabilities: [recon, portscan, service]
    enabled: true
    priority: 90
    requires_api_key: false

  # =========================================================================
  # VULNERABILITY SCANNER ADAPTERS
  # =========================================================================
  nuclei:
    type: bash
    path: "lib/adapter_nuclei.sh"
    capabilities: [vuln, cve, templates]
    enabled: true
    priority: 100
    requires_api_key: false

  zap:
    # ZAP adapter not yet implemented; placeholder kept disabled.
    type: bash
    path: "lib/adapter_zap.sh"
    capabilities: [vuln, tls, content, spider, ajax]
